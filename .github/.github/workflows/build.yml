# Pocket-Mapp-Creator — build Windows, macOS and Linux installers
# Copyright (c) 2026 project-tech-me
#
# How to run:
#   • Test build:  GitHub → Actions → "Build installers" → Run workflow
#                  → installers appear on a DRAFT release named "build-<number>"
#                    (Releases page; only you can see drafts — delete them when done)
#   • Release:     git tag v0.1.0 && git push origin v0.1.0
#                  → installers are published on a public release "v0.1.0"
#
# Installers go straight onto a GitHub Release, NOT into workflow artifacts,
# so they never count against the account's Actions artifact storage quota.
# Every action used runs on Node.js 24, and the app is built with Node.js 24.

name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create draft release
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            gh release create "$TAG" --draft --verify-tag \
              --title "Pocket-Mapp-Creator $TAG" --generate-notes
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Test build #${GITHUB_RUN_NUMBER}" \
              --notes "Test build from ${GITHUB_SHA::7}. Draft only — delete when no longer needed."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            files: dist/*-win-x64.exe dist/*-win-portable.exe
          - name: macOS
            os: macos-latest
            script: dist:mac
            files: dist/*.dmg
          - name: Linux
            os: ubuntu-24.04
            script: dist:linux
            files: dist/*.AppImage dist/*.deb

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # The macOS build is unsigned; stop electron-builder looking for a certificate
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach installers to the release
        shell: bash
        run: |
          ls -la dist
          gh release upload "${{ needs.prepare.outputs.tag }}" ${{ matrix.files }} --clobber

  publish:
    name: Publish release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Make the release public
        shell: bash
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest
